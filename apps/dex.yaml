apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
spec:
  destination:
    namespace: dex
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/osac-project/managed-cluster-config
    path: dex/overlays/hypershift1
    targetRevision: HEAD
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
